<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16243d"/><stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cc9f0"/><stop offset="1" stop-color="#37e29a"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <!-- pálya = a Q gyűrűje -->
  <circle cx="248" cy="248" r="128" fill="none" stroke="url(#ring)" stroke-width="30"/>
  <!-- a Q farka -->
  <line x1="318" y1="318" x2="386" y2="386" stroke="#37e29a" stroke-width="30" stroke-linecap="round"/>
  <!-- földi állomás középen -->
  <circle cx="248" cy="248" r="22" fill="#ffd166"/>
  <!-- műhold a pályán -->
  <g transform="translate(157.5 157.5) rotate(-45) scale(1.7)" stroke="#0a1220" stroke-width="3.5" stroke-linejoin="round">
    <rect x="-36" y="-10" width="23" height="20" rx="3" fill="#ffd166"/>
    <rect x="13" y="-10" width="23" height="20" rx="3" fill="#ffd166"/>
    <rect x="-13" y="-13" width="26" height="26" rx="6" fill="#ffffff"/>
  </g>
</svg>
