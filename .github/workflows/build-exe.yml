name: Build EXE

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: python -m PyInstaller --noconfirm --onefile --windowed --name Orbiq --collect-all sgp4 --icon assets\logo.ico --add-data "lang;lang" --add-data "assets;assets" orbiq.py
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbiq-exe
          path: dist/Orbiq.exe
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/Orbiq.exe --clobber
